name: Build IPA

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Gerar Secrets.swift
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: sh scripts/gen-secrets.sh

      - name: Gerar projeto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild -project Gym.xcodeproj -scheme Gym -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Gym.app Payload/
          # assinatura ad-hoc só para embutir as permissões (Saúde, App Group); o Sideloadly reassina
          codesign -f -s - --entitlements GymWidgets/GymWidgets.entitlements Payload/Gym.app/PlugIns/GymWidgets.appex
          codesign -f -s - --entitlements GymApp/Gym.entitlements Payload/Gym.app
          zip -qry Gym.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Gym-ipa
          path: Gym.ipa
