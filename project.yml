name: Gym
options:
  bundleIdPrefix: com.gym
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Gym:
    type: application
    platform: iOS
    sources: [GymApp]
    info:
      path: GymApp/Info.plist
      properties:
        CFBundleDisplayName: Gym
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: "O app usa o Bluetooth para ler o peso e a bioimpedância da sua balança."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gym.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
